<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:"DM Serif Display";src:url(dmserif.woff2) format("woff2");font-display:block}
html,body{margin:0;width:100vw;height:100vw;background:#ffffff;overflow:hidden}
/* gold border inset so the phone's rounded-corner mask never clips it */
.b{position:absolute;inset:7vw;border:5.2vw solid #efb43f;border-radius:17vw;box-sizing:border-box}
.t{position:absolute;inset:0;display:grid;place-items:center;font:44vw/1 "DM Serif Display",Georgia,serif;color:#1f2427;letter-spacing:-.02em;padding-top:4vw}
</style>
<div class="b"></div><div class="t">WF</div>
